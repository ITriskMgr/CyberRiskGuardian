schema_version: "1.1"
name: three-lines-model
tags: ["smoke", "textbook"]
runs: 2
execution:
  prompt: "Explain the three lines model as the CyberRiskGuardian governance textbook teaches it, and cite the chapter."
  max_turns: 10
  timeout_seconds: 600
  allowed_tools: ["Read", "Grep", "Glob", "Skill"]
graders:
  - name: citation
    type: "regex"
    pattern: "Chap(?:ter|itre)\\s+\\d+"
    flags: "i"
  - name: read-book
    type: "tool_used"
    tool: "Read"
    input_match: "references/ch\\d+"
  - name: faithful
    type: "llm"
    criteria: "The explanation follows the textbook: first line (operations and management, risk owners), second line (risk management and compliance oversight), third line (independent internal audit giving assurance to the board), and it may add the book's extension to executive management and the board. It cites a chapter of Léger's Introduction to Cybersecurity Governance and does not mix in content the book does not contain without saying so."
