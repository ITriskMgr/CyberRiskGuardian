schema_version: "1.1"
name: assess-french
tags: ["language"]
runs: 1
execution:
  prompt: "Le fichier medibec_profile.md se trouve dans un répertoire ajouté à cette session; trouvez-le avec Glob. Fais un balayage rapide CyberRiskGuardian pour MediBec : 20 candidats, 10 scénarios, verdicts avant traitement. Réponds dans la conversation."
  max_turns: 30
  timeout_seconds: 1200
  allowed_tools: ["Read", "Glob", "Grep", "Skill", "Bash", "Write"]
context:
  add_dirs: [fixtures]
graders:
  - name: french-markers
    type: "regex"
    pattern: "Estimation de l.analyste|D[ée]cision de la direction requise"
    flags: "i"
  - name: french-reply
    type: "llm"
    criteria: "The final reply is written in French and contains a table of about 10 scenarios with estimated risk, tolerated risk, ratio and a classification, followed by priorities and decisions for management."
